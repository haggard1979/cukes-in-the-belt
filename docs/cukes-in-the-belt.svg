<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 320 200" width="640" height="400" role="img" aria-labelledby="cb-title">
  <title id="cb-title">Cukes in the Belt: a jar of pickles from Nizhyn drifting through the asteroid belt</title>
  <!-- Same artwork as the Cukes in the Belt tile on tbloder.at (haggard1979/frontpage, public/index.html),
       made standalone: colours inline, background as SVG gradient, label "НІЖИН" (Fira Sans SemiBold) as outlines. -->
  <style>
    .cb-star { fill: #f4f1e3; }
    .cb-planet { fill: #d9a873; }
    .cb-planet-band, .cb-planet-spot { fill: #b4744a; }
    .cb-dust { fill: none; stroke: #c9b8a0; stroke-width: 34; stroke-linecap: round; opacity: 0.1; }
    .cb-rock { fill: #8b8076; }
    .cb-rock-shade { fill: #5a524b; }
    .cb-rocks-back { opacity: 0.75; }
    .cb-cuke { fill: #3d7a2c; }
    .cb-cuke-light { fill: none; stroke: #7aa94a; stroke-width: 2; stroke-linecap: round; }
    .cb-bump { fill: #a8d06e; }
    .cb-dill { fill: none; stroke: #9cc85a; stroke-width: 1.2; stroke-linecap: round; }
    .cb-bubble { fill: none; stroke: rgba(232, 246, 248, 0.8); stroke-width: 0.6; }
    .cb-glass, .cb-glass-neck { fill: rgba(214, 236, 240, 0.22); stroke: rgba(232, 246, 248, 0.8); stroke-width: 1.4; }
    .cb-brine { fill: rgba(196, 210, 112, 0.5); }
    .cb-lid { fill: #d9a441; }
    .cb-lid-dark { stroke: #a5761f; stroke-width: 1.4; }
    .cb-label { fill: #f4ecd4; }
    .cb-label-line { fill: none; stroke: #b7402c; stroke-width: 1.2; stroke-dasharray: 2 1.5; }
    .cb-label-text { fill: #2b4a1d; }
    .cb-glint { fill: none; stroke: #fff; stroke-width: 3.5; stroke-linecap: round; opacity: 0.4; }
  </style>
