        <use href="#cbi-cuke" x="-10" y="-26" width="20" height="52" transform="translate(14 14) rotate(9)"/>
        <use href="#cbi-cuke" x="-10" y="-26" width="20" height="52" transform="translate(0 47) rotate(84)"/>
