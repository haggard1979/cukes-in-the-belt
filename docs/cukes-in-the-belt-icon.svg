<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-labelledby="cbi-title">
  <title id="cbi-title">Cukes in the Belt</title>
  <!-- Icon version of docs/cukes-in-the-belt.svg: the pickle jar from Nizhyn in the asteroid belt,
       simplified for small sizes (no label text, no bumps, thicker strokes). -->
  <style>
    .star { fill: #f4f1e3; }
    .planet { fill: #d9a873; }
    .band { fill: #b4744a; }
    .dust { fill: none; stroke: #c9b8a0; stroke-width: 12; stroke-linecap: round; opacity: 0.12; }
    .rock { fill: #8b8076; }
    .rock-shade { fill: #5a524b; }
    .cuke { fill: #3d7a2c; }
    .cuke-light { fill: none; stroke: #7aa94a; stroke-width: 3; stroke-linecap: round; }
    .glass { fill: rgba(214, 236, 240, 0.22); stroke: rgba(232, 246, 248, 0.85); stroke-width: 3.5; }
    .brine { fill: rgba(196, 210, 112, 0.5); }
    .lid { fill: #d9a441; }
    .lid-dark { stroke: #a5761f; stroke-width: 3; }
    .label { fill: #f4ecd4; }
    .label-line { fill: none; stroke: #b7402c; stroke-width: 2.6; stroke-dasharray: 4 3; }
    .glint { fill: none; stroke: #fff; stroke-width: 5; stroke-linecap: round; opacity: 0.45; }
  </style>
  <defs>
    <radialGradient id="cbi-space" cx=".3" cy=".25" r="1">
      <stop offset="0" stop-color="#27305a"/>
      <stop offset="1" stop-color="#0a0c1a"/>
    </radialGradient>
    <clipPath id="cbi-tile"><rect width="64" height="64" rx="14"/></clipPath>
    <clipPath id="cbi-planet"><circle cx="58" cy="6" r="15"/></clipPath>
    <clipPath id="cbi-jar"><path d="M-27-40Q-38-38-38-26V46Q-38 58-26 58H26Q38 58 38 46V-26Q38-38 27-40Z"/></clipPath>
    <symbol id="cbi-cuke" viewBox="-10 -26 20 52">
