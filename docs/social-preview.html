<!doctype html>
<!-- Source of social-preview.png (GitHub: Settings > General > Social preview).
     Render at 1280 x 640 with a browser screenshot of the .card element, after the web fonts have loaded. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Jost:wght@600&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
.card{width:1280px;height:640px;position:relative;overflow:hidden;display:flex;align-items:center;gap:64px;padding:0 96px;box-sizing:border-box;
 background:radial-gradient(120% 100% at 30% 25%,#27305a,#0a0c1a);color:#f4f1e3}
.stars{position:absolute;inset:0}
img{width:400px;height:400px;flex:none;position:relative;filter:drop-shadow(0 18px 40px rgb(0 0 0 / .45))}
.text{position:relative}
h1{font:600 76px/1 Jost,sans-serif;margin:0 0 28px;white-space:nowrap;letter-spacing:.01em}
p{font:400 34px/1.35 Inter,sans-serif;margin:0;color:#d6d2c2}
.meta{margin-top:30px;font:500 26px/1 Inter,sans-serif;color:#9cc85a}

<circle cx="1150" cy="560" r="2.5"/><circle cx="820" cy="600" r="1.5"/><circle cx="600" cy="560" r="2"/><circle cx="40" cy="600" r="2"/><circle cx="1240" cy="330" r="1.5"/></g>
<path d="M-40 640C400 520 800 360 1320 120" fill="none" stroke="#c9b8a0" stroke-width="140" stroke-linecap="round" opacity=".06"/></svg>
<img src="cukes-in-the-belt-icon.svg">
<div class="text"><h1>Cukes in the Belt</h1>
<p>Run Cucumber features inside<br>Jakarta EE containers with<br>Arquillian and JUnit 5</p>
<div class="meta">Java · Cucumber · Arquillian · Jakarta EE</div></div>
</div></body></html>
