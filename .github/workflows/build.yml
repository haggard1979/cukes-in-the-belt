name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # stable name: it is the required status check of the branch protection
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # compiles with -Werror and Error Prone, runs the core unit tests and the examples
      # against TomEE embedded, Weld embedded and WildFly managed (downloaded by Maven,
      # cached with the repository) and writes the JaCoCo report of core
      - name: Build
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Coverage summary
        if: success()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, collections
          rows = csv.DictReader(open('coverage/target/site/jacoco-aggregate/jacoco.csv'))
          packages = collections.defaultdict(lambda: [0, 0, 0, 0])
          for r in rows:
              p = packages[r['PACKAGE']]
              p[0] += int(r['LINE_MISSED']); p[1] += int(r['LINE_COVERED'])
              p[2] += int(r['BRANCH_MISSED']); p[3] += int(r['BRANCH_COVERED'])
          pct = lambda missed, covered: f"{100 * covered / (missed + covered):.1f} %" if missed + covered else "-"
          print("### Coverage of core (JaCoCo)\n")
          print("| Package | Lines | Branches |\n|---|---:|---:|")
          total = [0, 0, 0, 0]
          for name, p in sorted(packages.items()):
              total = [t + v for t, v in zip(total, p)]
              print(f"| `{name}` | {pct(p[0], p[1])} | {pct(p[2], p[3])} |")
          print(f"| **Total** | **{pct(total[0], total[1])}** | **{pct(total[2], total[3])}** |")
          PY

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/target/site/jacoco-aggregate/
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            examples-wildfly/target/wildfly-*/standalone/log/
          retention-days: 14
